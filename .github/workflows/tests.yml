name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    # v0.39.1 tag CI observed a 1964s (32.7 min) Windows unit step. Combining it
    # with measured Windows setup (52s) and post-unit steps (93s) gives 2109s,
    # above the old 35 min (2100s) cap. That candidate failed a test assertion,
    # not the job cap. 45 min leaves room for the full suite and smoke steps;
    # a hung job remains bounded. Stateful and advisory caps stay unchanged.
    # v0.43.0 grew the suite by more than 500 tests. One single-process local
    # Windows run took about 35 min, and scaling the last recorded CI time leaves
    # under 4 min below a 45 min cap. That margin is an estimate, not a CI
    # measurement. 60 min keeps a slow runner from failing the release gate.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.12', '3.14']
    env:
      PYTHONUTF8: '1'
    steps:
      # fetch-depth: 0 also fetches the release tags: the vault_period differential
      # test (tests/test_vault_period_metamorphic.py) reads a tagged release with git show.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and filesystem integration tests
        run: python -m unittest discover -s tests -v
      - name: Bilingual lexical retrieval regression
        run: python scripts/evaluate_recall.py
      - name: Temporal and graph retrieval comparison
        run: python scripts/evaluate_recall.py --fixture tests/fixtures/recall_advanced --compare --max-no-answer-false-positive-rate 0 --max-forbidden-exposure-rate 0 --max-stale-top-1-rate 0
      - name: Interdependent synthetic memory workflows
        run: python scripts/evaluate_memory_workflows.py --backend deterministic
      - name: Korean structured-answer and evidence regression
        run: python scripts/evaluate_korean_memory.py
      - name: Synthetic tool-call safety controls (no model calls)
        run: python scripts/evaluate_tool_safety.py --backend scripted-control
      - name: Source-bound improvement experiment contracts (no model calls)
        run: python scripts/evaluate_improvement_experiments.py
      - name: Evaluator and improvement-cost evidence (no model calls)
        run: python scripts/evaluate_improvement_accounting.py
      - name: Paired memory formation controls (no model calls)
        run: python scripts/evaluate_memory_formation.py
      - name: Cross-process selective memory repair controls (no model calls)
        run: python scripts/evaluate_memory_lifecycle.py
      - name: Source-role and poisoned-experience contrast (no model calls)
        run: python scripts/evaluate_memory_trust.py --check-controls
      - name: Paired model-lifecycle contract (scripted control; no model calls)
        run: python scripts/evaluate_model_memory_lifecycle.py --case ascii
      - name: Stage-specific memory intervention controls (no model calls)
        run: python scripts/evaluate_memory_stages.py
      - name: Fresh paired Korean answer contracts (no model calls)
        run: python scripts/evaluate_model_korean_memory.py
      - name: Source-bound skill routing controls (no model or host calls)
        run: >-
          python scripts/evaluate_skill_routing.py evaluate
          --catalog tests/fixtures/skill_routing/catalog.json
          --cases tests/fixtures/skill_routing/cases.json
          --trace tests/fixtures/skill_routing/control-pass.json
          --output skill-routing-control.json
      - name: Source-bound assembly and procedure examples (no model calls)
        run: python scripts/evaluate_memory_reliability.py
      - name: Handoff fold loss alarm (no model calls)
        run: python scripts/evaluate_handoff_fold.py
      - name: Measure preservation check mutation fidelity (report only; no model calls)
        run: python scripts/evaluate_verifier_fidelity.py
      - name: Hard bilingual recall at top3 (explicit query expansion)
        run: python scripts/evaluate_recall.py --fixture tests/fixtures/recall_hard --compare --expand-query --query-mapping 00-meta/query-map.txt --top-k 3 --max-tokens 1500 --max-no-answer-false-positive-rate 0.25 --max-stale-top-1-rate 0
      - name: Hard bilingual recall at top5 (same token budget)
        run: python scripts/evaluate_recall.py --fixture tests/fixtures/recall_hard --compare --expand-query --query-mapping 00-meta/query-map.txt --top-k 5 --max-tokens 1500 --max-no-answer-false-positive-rate 0.25 --max-stale-top-1-rate 0
      - name: Authored evidence on actual recall (original synthetic vaults)
        run: python scripts/evaluate_recall_support.py
      - name: Lesson observation scorer (scripted demo; no host or model calls)
        run: python scripts/evaluate_lesson_cue_effects.py
      - name: Compile Python sources
        run: python -m compileall -q hooks skills/agentic-vault/scripts scripts
      # Compare the committed tree with git's built-in empty tree so every
      # tracked file is checked. A bare `git diff --check` only compares the
      # working tree with the index, which is always clean after checkout.
      - name: Whitespace validation (whole committed tree)
        run: git diff --check 4b825dc642cb6eb9a060e54bf8d69288fbee4904 HEAD

  stateful:
    name: Stateful lifecycle / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: windows-latest
            python: '3.14'
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies only
        run: python -m pip install -r requirements-dev.txt
      - name: Generated lifecycle, relation and configured egress regressions
        run: python -m unittest tests.test_stateful_memory_lifecycle tests.test_stateful_relation_probes tests.test_stateful_revocation_egress -v

  # Advisory supply-chain checks. Findings surface as warnings; this job never
  # fails the workflow and gets no write, OIDC or code-scanning permission.
  supply-chain-audit:
    name: Supply-chain audit (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read  # checkout only; no SARIF upload (security-events) or OIDC (id-token)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      # Cool-down pin: v0.7.0 and v0.7.1 were both published 2026-10-15, so the
      # job uses v0.6.4 (2026-09-09). It runs zizmor from the Docker image whose
      # digest its own support/versions file pins; 1.30.1 (2026-09-09) is the
      # newest version listed there. advanced-security: false prints findings to
      # the log instead of uploading SARIF, so no security-events permission is needed.
      - name: Workflow static analysis (zizmor)
        id: zizmor
        continue-on-error: true
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: '1.30.1'
          advanced-security: false
      # pip hash-checking mode with the job's Python: ci/requirements-audit.txt pins
      # pip-audit and its whole dependency closure for Python 3.12, with a sha256
      # for every file PyPI lists for each pinned version (pip-compile
      # --generate-hashes; refresh steps in docs/release-integrity.md).
      # --require-hashes rejects an unlisted hash or dependency; --only-binary :all:
      # rejects source distributions, so no package build code runs.
      - name: Install pip-audit (hash-checked wheels)
        id: pip-audit-install
        continue-on-error: true
        run: |
          python -m pip install --require-hashes --only-binary :all: -r ci/requirements-audit.txt
      # requirements-dev.txt pins each package with ==, so --no-deps audits exactly
      # those versions. --disable-pip is what avoids an install: without it,
      # pip-audit 2.10.1 (even with --no-deps) creates a temporary venv and runs
      # `pip install --upgrade pip wheel setuptools` and a --dry-run resolve of the
      # file there, both without hashes. With it, pip-audit only parses the file and
      # queries the PyPI vulnerability service.
      - name: Development dependency audit (pip-audit)
        id: pip-audit
        if: ${{ steps.pip-audit-install.outcome == 'success' }}
        continue-on-error: true
        run: python -m pip_audit --no-deps --disable-pip --progress-spinner off -r requirements-dev.txt
      - name: Report advisory results
        if: ${{ !cancelled() }}
        env:
          ZIZMOR_OUTCOME: ${{ steps.zizmor.outcome }}
          PIP_AUDIT_INSTALL_OUTCOME: ${{ steps.pip-audit-install.outcome }}
          PIP_AUDIT_OUTCOME: ${{ steps.pip-audit.outcome }}
        run: |
          echo "zizmor: ${ZIZMOR_OUTCOME}; pip-audit install: ${PIP_AUDIT_INSTALL_OUTCOME}; pip-audit: ${PIP_AUDIT_OUTCOME}"
          if [ "${ZIZMOR_OUTCOME}" != success ]; then
            echo "::warning title=zizmor (advisory)::findings or tool error; see the zizmor step log"
          fi
          if [ "${PIP_AUDIT_INSTALL_OUTCOME}" != success ]; then
            echo "::warning title=pip-audit install (advisory)::hash-checked install failed; see the install step log"
          fi
          if [ "${PIP_AUDIT_OUTCOME}" != success ]; then
            echo "::warning title=pip-audit (advisory)::findings or tool error; see the pip-audit step log"
          fi
