name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.12', '3.14']
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and filesystem integration tests
        run: python -m unittest discover -s tests -v
      - name: Bilingual lexical retrieval regression
        run: python scripts/evaluate_recall.py
      - name: Compile Python sources
        run: python -m compileall -q hooks skills/agentic-vault/scripts scripts
      # Compare the committed tree with git's built-in empty tree so every
      # tracked file is checked. A bare `git diff --check` only compares the
      # working tree with the index, which is always clean after checkout.
      - name: Whitespace validation (whole committed tree)
        run: git diff --check 4b825dc642cb6eb9a060e54bf8d69288fbee4904 HEAD
