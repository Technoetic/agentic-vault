name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.12', '3.14']
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and filesystem integration tests
        run: python -m unittest discover -s tests -v
      - name: Bilingual lexical retrieval regression
        run: python scripts/evaluate_recall.py
      - name: Temporal and graph retrieval comparison
        run: python scripts/evaluate_recall.py --fixture tests/fixtures/recall_advanced --compare --max-no-answer-false-positive-rate 0 --max-forbidden-exposure-rate 0 --max-stale-top-1-rate 0
      - name: Interdependent synthetic memory workflows
        run: python scripts/evaluate_memory_workflows.py --backend deterministic
      - name: Korean structured-answer and evidence regression
        run: python scripts/evaluate_korean_memory.py
      - name: Synthetic tool-call safety controls (no model calls)
        run: python scripts/evaluate_tool_safety.py --backend scripted-control
      - name: Hard bilingual recall at top3 (explicit query expansion)
        run: python scripts/evaluate_recall.py --fixture tests/fixtures/recall_hard --compare --expand-query --query-mapping 00-meta/query-map.txt --top-k 3 --max-tokens 1500 --max-no-answer-false-positive-rate 0.25 --max-stale-top-1-rate 0
      - name: Hard bilingual recall at top5 (same token budget)
        run: python scripts/evaluate_recall.py --fixture tests/fixtures/recall_hard --compare --expand-query --query-mapping 00-meta/query-map.txt --top-k 5 --max-tokens 1500 --max-no-answer-false-positive-rate 0.25 --max-stale-top-1-rate 0
      - name: Compile Python sources
        run: python -m compileall -q hooks skills/agentic-vault/scripts scripts
      # Compare the committed tree with git's built-in empty tree so every
      # tracked file is checked. A bare `git diff --check` only compares the
      # working tree with the index, which is always clean after checkout.
      - name: Whitespace validation (whole committed tree)
        run: git diff --check 4b825dc642cb6eb9a060e54bf8d69288fbee4904 HEAD

  stateful:
    name: Stateful lifecycle / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: windows-latest
            python: '3.14'
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies only
        run: python -m pip install -r requirements-dev.txt
      - name: Generated proposal and operation lifecycle regressions
        run: python tests/test_stateful_memory_lifecycle.py

  # Advisory supply-chain checks. Findings surface as warnings; this job never
  # fails the workflow and gets no write, OIDC or code-scanning permission.
  supply-chain-audit:
    name: Supply-chain audit (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read  # checkout only; no SARIF upload (security-events) or OIDC (id-token)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      # The action installs zizmor from the hash-pinned wheel lock in its own
      # tree. advanced-security: false prints findings to the log instead of
      # uploading SARIF, so no security-events permission is needed.
      - name: Workflow static analysis (zizmor)
        id: zizmor
        continue-on-error: true
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          version: '1.31.1'
          advanced-security: false
      # The action code is pinned by SHA, but it installs pip-audit
      # (~= 2.0, >= 2.5.6) from PyPI at run time without hashes.
      - name: Development dependency audit (pip-audit)
        id: pip-audit
        continue-on-error: true
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: requirements-dev.txt
      - name: Report advisory results
        if: ${{ !cancelled() }}
        env:
          ZIZMOR_OUTCOME: ${{ steps.zizmor.outcome }}
          PIP_AUDIT_OUTCOME: ${{ steps.pip-audit.outcome }}
        run: |
          echo "zizmor: ${ZIZMOR_OUTCOME}; pip-audit: ${PIP_AUDIT_OUTCOME}"
          if [ "${ZIZMOR_OUTCOME}" != success ]; then
            echo "::warning title=zizmor (advisory)::findings or tool error; see the zizmor step log"
          fi
          if [ "${PIP_AUDIT_OUTCOME}" != success ]; then
            echo "::warning title=pip-audit (advisory)::findings or tool error; see the pip-audit step log"
          fi
